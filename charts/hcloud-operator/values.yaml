# Default values for hcloud-operator.

namespace:
  create: true
  name: hcloud-operator-system

image:
  repository: ghcr.io/armanfeyzi/hcloud-operator
  tag: v0.8.4
  pullPolicy: IfNotPresent

replicaCount: 1

# Leader election. Enabled by default so running more than one replica is safe;
# the chart ClusterRole grants the required coordination.k8s.io/leases RBAC.
# Set false only for single-replica or local runs where the lease is unnecessary.
leaderElect: true

secret:
  # When false (default), create the Secret before install:
  #   kubectl create secret generic hcloud-operator-secret -n hcloud-operator-system --from-literal=token="$HCLOUD_TOKEN"
  create: false
  name: hcloud-operator-secret
  key: token
  # Only used when secret.create is true (dev/quickstart; do not commit real tokens).
  token: ""

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

metricsPort: 8082
healthPort: 8081

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: hcloud-operator

rbac:
  create: true
