name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run go fmt
        run: if [ "$(go fmt ./... | wc -l)" -gt 0 ]; then echo "Code formatting issues found. Please run 'go fmt ./...'" && exit 1; fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: make test
