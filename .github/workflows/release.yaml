name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate installation manifest
        run: |
          # Same pattern as local checkout: point kustomize image → GHCR tag (${{ github.ref_name }} == vX.Y.Z)
          cd config/manager
          kustomize edit set image localhost/hcloud-operator:dev=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cd ../..
          kubectl kustomize config/default/ > install.yaml

      - name: Verify install manifest
        run: |
          grep -q "image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}" install.yaml
          grep -q "kind: Deployment" install.yaml
          grep -q "hcloud-operator-system" install.yaml

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm chart
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/hcloud-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/hcloud-operator/Chart.yaml
          sed -i "s|tag:.*|tag: ${REF_NAME}|" charts/hcloud-operator/values.yaml
          helm lint charts/hcloud-operator
          mkdir -p dist
          helm package charts/hcloud-operator -d dist/
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install.yaml
            dist/hcloud-operator-*.tgz
          generate_release_notes: true
