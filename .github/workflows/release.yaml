name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate installation manifest
        run: |
          # Replace the image tag in the deployment manifest
          cd config/manager
          kustomize edit set image localhost/hcloud-operator:dev=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cd ../..
          # Build the final install.yaml
          kubectl kustomize config/default/ > install.yaml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: install.yaml
          generate_release_notes: true
