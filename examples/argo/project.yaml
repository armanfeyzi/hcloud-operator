apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: hcloud-operator
  namespace: argocd
spec:
  description: HKIC operator and Hetzner Cloud infrastructure CRs
  sourceRepos:
    - https://github.com/armanfeyzi/hcloud-operator.git
    - '*'  # allow fork URLs; tighten in production
  destinations:
    - namespace: hcloud-operator-system
      server: https://kubernetes.default.svc
    - namespace: default
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: infra.hkc.io
      kind: '*'
    - group: apps
      kind: Deployment
    - group: ''
      kind: ServiceAccount
    - group: ''
      kind: Secret
    - group: ''
      kind: Namespace
