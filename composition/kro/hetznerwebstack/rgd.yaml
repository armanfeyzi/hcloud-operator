# HetznerWebStack — kro ResourceGraphDefinition for a single web-tier stack.
# Expands into HKIC CRDs (network → server → optional volume/LB/firewall).
# Requires kro v0.9.x and HKIC CRDs installed (operator optional for render tests).
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: hetznerwebstack
spec:
  schema:
    apiVersion: v1alpha1
    kind: HetznerWebStack
    scope: Namespaced
    spec:
      location: string | required=true description="Hetzner location (e.g. fsn1)"
      labels: "map[string]string"
      network:
        ipRange: string | required=true
        zones: "[]string"
      server:
        type: string | required=true
        image: string | required=true
        sshKeys: "[]string"
        userData: string
      volume:
        size: integer
        format: string
      loadBalancer:
        type: string
        algorithm: string | default="round_robin"
        services: object
      firewall:
        rules: object
    status:
      serverPublicIPv4: ${server.status.publicIPv4}
      serverID: ${server.status.serverID}
      loadBalancerPublicIPv4: ${loadBalancer.status.?publicIPv4.orValue("")}
    additionalPrinterColumns:
      - jsonPath: .status.serverPublicIPv4
        name: Server IPv4
        type: string
      - jsonPath: .status.loadBalancerPublicIPv4
        name: LB IPv4
        type: string

  resources:
    - id: network
      template:
        apiVersion: infra.hkc.io/v1alpha1
        kind: HCloudNetwork
        metadata:
          name: ${schema.metadata.name + "-net"}
        spec:
          ipRange: ${schema.spec.network.ipRange}
          networkZones: ${schema.spec.network.zones}
          labels: ${schema.spec.labels}

    - id: server
      template:
        apiVersion: infra.hkc.io/v1alpha1
        kind: HCloudServer
        metadata:
          name: ${schema.metadata.name + "-srv"}
          labels:
            hetznerwebstack.hkc.io/stack: ${schema.metadata.name}
        spec:
          serverType: ${schema.spec.server.type}
          image: ${schema.spec.server.image}
          location: ${schema.spec.location}
          networkRef:
            name: ${network.metadata.name}
          sshKeys: ${schema.spec.server.sshKeys}
          userData: ${schema.spec.server.userData}
          labels: ${schema.spec.labels}

    - id: volume
      includeWhen:
        - ${has(schema.spec.volume) && has(schema.spec.volume.size) && schema.spec.volume.size > 0}
      template:
        apiVersion: infra.hkc.io/v1alpha1
        kind: HCloudVolume
        metadata:
          name: ${schema.metadata.name + "-vol"}
        spec:
          size: ${schema.spec.volume.size}
          format: ${schema.spec.volume.format}
          serverRef:
            name: ${server.metadata.name}
          labels: ${schema.spec.labels}

    - id: loadBalancer
      includeWhen:
        - ${has(schema.spec.loadBalancer)}
      template:
        apiVersion: infra.hkc.io/v1alpha1
        kind: HCloudLoadBalancer
        metadata:
          name: ${schema.metadata.name + "-lb"}
        spec:
          loadBalancerType: ${schema.spec.loadBalancer.type}
          location: ${schema.spec.location}
          algorithm: ${schema.spec.loadBalancer.algorithm}
          serverSelector:
            matchLabels:
              hetznerwebstack.hkc.io/stack: ${schema.metadata.name}
          services: ${schema.spec.loadBalancer.services}
          labels: ${schema.spec.labels}

    - id: firewall
      includeWhen:
        - ${has(schema.spec.firewall)}
      template:
        apiVersion: infra.hkc.io/v1alpha1
        kind: HCloudFirewall
        metadata:
          name: ${schema.metadata.name + "-fw"}
        spec:
          rules: ${schema.spec.firewall.rules}
          applyTo:
            serverRefs:
              - name: ${server.metadata.name}
          labels: ${schema.spec.labels}
