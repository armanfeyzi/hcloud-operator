---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: hcloudservers.infra.hkc.io
spec:
  group: infra.hkc.io
  names:
    kind: HCloudServer
    listKind: HCloudServerList
    plural: hcloudservers
    shortNames:
    - hcs
    singular: hcloudserver
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serverType
      name: ServerType
      type: string
    - jsonPath: .spec.location
      name: Location
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.publicIPv4
      name: IP
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HCloudServer is the Schema for the hcloudservers API.
          It represents a Hetzner Cloud virtual machine managed by the hcloud-operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HCloudServerSpec defines the desired state of an HCloudServer.
            properties:
              image:
                description: Image is the OS image to use (e.g. ubuntu-22.04, debian-12).
                minLength: 1
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels to attach to the Hetzner Cloud server resource.
                type: object
              location:
                description: Location is the Hetzner datacenter location (e.g. fsn1,
                  nbg1, hel1, ash, hil).
                minLength: 1
                type: string
              networkRef:
                description: |-
                  NetworkRef points to an HCloudNetwork by name.
                  When set, the controller attaches this server to the referenced private network.
                properties:
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              placementGroupRef:
                description: |-
                  PlacementGroupRef points to an HCloudPlacementGroup by name.
                  Applied at server creation time only; immutable after the server exists in Hetzner.
                properties:
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              serverType:
                description: |-
                  ServerType is the Hetzner Cloud server type (e.g. cx21, cx31, cpx41).
                  May be changed after creation; the controller powers off the server, changes type via the API, then powers it on again.
                minLength: 1
                type: string
              sshKeys:
                description: SSHKeys is a list of SSH key names or IDs to inject into
                  the server on creation.
                items:
                  type: string
                type: array
              upgradeDisk:
                description: UpgradeDisk controls whether the local disk is upgraded
                  when serverType changes via Hetzner change_type.
                type: boolean
              userData:
                description: |-
                  UserData is cloud-init user-data to pass to the server on first boot.
                  Must be a valid cloud-config or shell script. Applied once at creation time.
                maxLength: 32768
                type: string
            required:
            - image
            - location
            - serverType
            type: object
            x-kubernetes-validations:
            - message: image is immutable after creation
              rule: self.image == oldSelf.image
            - message: location is immutable after creation
              rule: self.location == oldSelf.location
          status:
            description: HCloudServerStatus defines the observed state of an HCloudServer.
            properties:
              appliedNetworkID:
                description: AppliedNetworkID is the network ID currently managed
                  for this server via spec.networkRef.
                format: int64
                type: integer
              appliedPlacementGroupID:
                description: AppliedPlacementGroupID is the placement group ID used
                  when this server was created.
                format: int64
                type: integer
              appliedServerType:
                description: |-
                  AppliedServerType is the server type the controller has fully converged to (API type matches spec and server was running).
                  While spec.serverType differs from the value in Hetzner, or before this field is set after a type change, a resize may be in progress.
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the server's current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              publicIPv4:
                description: PublicIPv4 is the server's public IPv4 address.
                type: string
              publicIPv6:
                description: PublicIPv6 is the server's public IPv6 network prefix.
                type: string
              serverID:
                description: ServerID is the Hetzner Cloud internal server ID.
                format: int64
                type: integer
              state:
                description: State is the current Hetzner server state (e.g. running,
                  stopped, initializing).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
