# Multi-node k3s bootstrap template: one server node + two agent nodes.
#
# This sample is intended as a practical join-flow starting point.
# It is designed as a two-phase flow:
# 1) apply infrastructure (network + server + agent VMs)
# 2) configure/join agents using hack/configure-k3s-join-agents.sh
#
# Before apply:
# - Replace REPLACE_WITH_HCLOUD_SSH_KEY_NAME on all servers.
# - Replace REPLACE_WITH_SHARED_K3S_TOKEN with a strong random secret.
#
# Apply:
#   kubectl apply -f config/samples/complex/k3s-multi-node-join/k3s_multi_node_join_v1alpha1.yaml
#
# Note:
# - `userData` runs only on first server creation. If you change token/join
#   settings, recreate affected nodes.
# - Agent nodes are provisioned first; run join script after server is up:
#     hack/configure-k3s-join-agents.sh k3s-join-server
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudNetwork
metadata:
  name: k3s-join-private
spec:
  ipRange: 10.220.0.0/16
  networkZones:
    - eu-central
  labels:
    app.kubernetes.io/name: k3s-join
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudServer
metadata:
  name: k3s-join-server
  labels:
    app.kubernetes.io/name: k3s-join
    role: k3s-server
spec:
  serverType: cx23
  image: ubuntu-22.04
  location: fsn1
  sshKeys:
    - REPLACE_WITH_HCLOUD_SSH_KEY_NAME
  networkRef:
    name: k3s-join-private
  labels:
    app.kubernetes.io/name: k3s-join
    role: k3s-server
  userData: |
    #cloud-config
    package_update: true
    packages:
      - curl
    runcmd:
      - |
        set -eux
        PUBIP="$(curl -fs http://169.254.169.254/hetzner/v1/metadata/public-ipv4)"
        PRIVIP="$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i==\"src\"){print $(i+1); exit}}')"
        PRIVIF="$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i==\"dev\"){print $(i+1); exit}}')"
        TOKEN="REPLACE_WITH_SHARED_K3S_TOKEN"
        export INSTALL_K3S_CHANNEL=stable
        EXTRA_ARGS=""
        if [ -n "${PRIVIP}" ]; then
          EXTRA_ARGS="${EXTRA_ARGS} --node-ip=${PRIVIP} --advertise-address=${PRIVIP}"
        fi
        if [ -n "${PRIVIF}" ]; then
          EXTRA_ARGS="${EXTRA_ARGS} --flannel-iface=${PRIVIF}"
        fi
        export INSTALL_K3S_EXEC="server --token=${TOKEN}${EXTRA_ARGS} --tls-san=${PUBIP} --disable traefik"
        curl -sfL https://get.k3s.io | sh -
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudServer
metadata:
  name: k3s-join-agent-1
  labels:
    app.kubernetes.io/name: k3s-join
    role: k3s-agent
spec:
  serverType: cx23
  image: ubuntu-22.04
  location: fsn1
  sshKeys:
    - REPLACE_WITH_HCLOUD_SSH_KEY_NAME
  networkRef:
    name: k3s-join-private
  labels:
    app.kubernetes.io/name: k3s-join
    role: k3s-agent
  userData: |
    #cloud-config
    package_update: true
    packages:
      - curl
    runcmd:
      - |
        # Agent join is configured in phase-2 via:
        # hack/configure-k3s-join-agents.sh
        echo "k3s agent join is configured post-provisioning."
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudServer
metadata:
  name: k3s-join-agent-2
  labels:
    app.kubernetes.io/name: k3s-join
    role: k3s-agent
spec:
  serverType: cx23
  image: ubuntu-22.04
  location: fsn1
  sshKeys:
    - REPLACE_WITH_HCLOUD_SSH_KEY_NAME
  networkRef:
    name: k3s-join-private
  labels:
    app.kubernetes.io/name: k3s-join
    role: k3s-agent
  userData: |
    #cloud-config
    package_update: true
    packages:
      - curl
    runcmd:
      - |
        # Agent join is configured in phase-2 via:
        # hack/configure-k3s-join-agents.sh
        echo "k3s agent join is configured post-provisioning."
