# Demo stack: one private network, one Hetzner Cloud server attached to it,
# one block volume attached to that server, and a load balancer selecting it
# by Kubernetes labels (serverSelector). LB services (listen/target ports) are
# supported in HCloudLoadBalancer.spec.services — see the loadBalancer block below.
#
# Prerequisites — install ALL CRDs first:
#   make install
# Then apply (operator running with HCLOUD_TOKEN):
#   kubectl apply -f config/samples/complex/hcloud-stack/hcloud_stack_v1alpha1.yaml
#
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudNetwork
metadata:
  name: demo-private-net
spec:
  ipRange: 10.90.0.0/16
  networkZones:
    - eu-central
  labels:
    env: demo
    managed-by: hcloud-operator
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudServer
metadata:
  name: demo-web
  labels:
    app.kubernetes.io/name: demo-web
    # Matched by HCloudLoadBalancer.spec.serverSelector below.
    demo.hkc.io/lb: web
spec:
  serverType: cx23
  image: ubuntu-22.04
  location: fsn1
  networkRef:
    name: demo-private-net
  labels:
    env: demo
    managed-by: hcloud-operator
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudVolume
metadata:
  name: demo-web-data
spec:
  size: 20
  format: ext4
  serverRef:
    name: demo-web
  labels:
    env: demo
    managed-by: hcloud-operator
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudLoadBalancer
metadata:
  name: demo-web-public
spec:
  loadBalancerType: lb11
  location: fsn1
  algorithm: round_robin
  serverSelector:
    matchLabels:
      demo.hkc.io/lb: web
  labels:
    env: demo
    managed-by: hcloud-operator
