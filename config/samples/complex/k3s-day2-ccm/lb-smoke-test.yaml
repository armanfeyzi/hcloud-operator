apiVersion: apps/v1
kind: Deployment
metadata:
  name: ccm-lb-smoke
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ccm-lb-smoke
  template:
    metadata:
      labels:
        app: ccm-lb-smoke
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args:
            - "-text=ccm-ok"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: ccm-lb-smoke
  namespace: default
spec:
  selector:
    app: ccm-lb-smoke
  ports:
    - port: 80
      targetPort: 5678
  type: LoadBalancer
