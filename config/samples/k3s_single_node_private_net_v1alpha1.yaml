# Single-node k3s on Hetzner Cloud: private network + HCloudServer with cloud-init.
#
# Full walkthrough: docs/k3s-on-hcloud.md
#
# Prerequisites:
#   make install   # or kubectl apply -f config/crd/bases/
#   Operator running with HCLOUD_TOKEN
#
# Before apply:
#   - Replace REPLACE_WITH_HCLOUD_SSH_KEY_NAME with an SSH key *name* from
#     Hetzner Cloud → Security → SSH keys (so you can SSH as root for debugging
#     and to copy /etc/rancher/k3s/k3s.yaml).
#   - Adjust serverType, location, or network zones if needed.
#
# Apply:
#   kubectl apply -f config/samples/k3s_single_node_private_net_v1alpha1.yaml
#
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudNetwork
metadata:
  name: k3s-demo-private
spec:
  ipRange: 10.200.0.0/16
  networkZones:
    - eu-central
  labels:
    app.kubernetes.io/name: k3s-demo
---
apiVersion: infra.hkc.io/v1alpha1
kind: HCloudServer
metadata:
  name: k3s-demo-server
  labels:
    app.kubernetes.io/name: k3s-demo
    role: k3s-server
spec:
  serverType: cx23
  image: ubuntu-22.04
  location: fsn1
  sshKeys:
    - REPLACE_WITH_HCLOUD_SSH_KEY_NAME
  networkRef:
    name: k3s-demo-private
  labels:
    app.kubernetes.io/name: k3s-demo
  # cloud-init: install k3s server on first boot.
  # - Private NIC is typically eth1 when a network is attached (verify if your install fails).
  # - Public IPv4 from Hetzner metadata for apiserver TLS SAN (kubectl from laptop).
  userData: |
    #cloud-config
    package_update: true
    packages:
      - curl
    runcmd:
      - |
        set -eux
        PUBIP="$(curl -fs http://169.254.169.254/hetzner/v1/metadata/public-ipv4)"
        PRIVIP="$(ip -4 -o addr show eth1 | awk '{print $4}' | cut -d/ -f1)"
        export INSTALL_K3S_CHANNEL=stable
        export INSTALL_K3S_EXEC="server --node-ip=${PRIVIP} --advertise-address=${PRIVIP} --flannel-iface=eth1 --tls-san=${PUBIP} --disable traefik"
        curl -sfL https://get.k3s.io | sh -
