apiVersion: apps/v1
kind: Deployment
metadata:
  name: hcloud-operator
  namespace: hcloud-operator-system
  labels:
    app: hcloud-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hcloud-operator
  template:
    metadata:
      labels:
        app: hcloud-operator
    spec:
      serviceAccountName: hcloud-operator
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 10
      containers:
      - name: manager
        image: localhost/hcloud-operator:dev
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect=false
        env:
        - name: HCLOUD_TOKEN
          valueFrom:
            secretKeyRef:
              name: hcloud-operator-secret
              key: token
        ports:
        - name: metrics
          containerPort: 8082
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
